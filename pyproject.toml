[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "small-gpt-agent"
version = "0.1.0"
description = "From Small GPT to an Agentic AI System"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", "venv", ".git", "build", "dist"]
